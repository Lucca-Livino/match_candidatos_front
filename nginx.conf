server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Faz em producao o papel do proxy do Vite: front e API na mesma origem,
    # entao o cookie de sessao do Better Auth funciona sem CORS. "api" e o
    # nome do servico no docker-compose.prod.yml da API.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # O proxy do FSLab termina o HTTPS na frente; repassa o protocolo
        # original em vez do http interno.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Avaliacao por LLM pode demorar mais que o padrao de 60s.
        proxy_read_timeout 180s;
    }

    # Arquivos com hash no nome: podem ficar em cache para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota do React Router cai no index.html, senao um F5 em
    # /vagas devolve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
